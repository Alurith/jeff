name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Cross-build
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            echo "$target"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$RUNNER_TEMP/jeff-$os-$arch" ./cmd/jeff
          done
