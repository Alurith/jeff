name: Evaluations

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-synthetic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate datasets
        run: |
          go run ./evals/cmd/jeff-eval validate \
            --dataset evals/datasets/dev/cases.yaml \
            --dataset evals/datasets/test/cases.yaml \
            --dataset evals/datasets/holdout/cases.yaml

      - name: Synthetic smoke
        run: |
          rm -rf "$RUNNER_TEMP/jeff-eval-smoke"
          go run ./evals/cmd/jeff-eval run \
            --dataset evals/datasets/dev/cases.yaml \
            --profile smoke --provider synthetic \
            --out "$RUNNER_TEMP/jeff-eval-smoke"
          cat "$RUNNER_TEMP/jeff-eval-smoke/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload synthetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-synthetic-${{ github.sha }}
          path: ${{ runner.temp }}/jeff-eval-smoke

  release-ref-guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require protected release ref
        run: test "${GITHUB_REF}" = "refs/heads/master"

  real-eval:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: evals-release
    strategy:
      fail-fast: false
      matrix:
        split: [test, holdout]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate dataset
        run: go run ./evals/cmd/jeff-eval validate --dataset evals/datasets/${{ matrix.split }}/cases.yaml

      - name: Run real evaluation
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY_EVALS }}
        run: |
          rm -rf "$RUNNER_TEMP/jeff-eval-${{ matrix.split }}"
          go run ./evals/cmd/jeff-eval run \
            --dataset evals/datasets/${{ matrix.split }}/cases.yaml \
            --profile all --provider real --repetitions 3 \
            --out "$RUNNER_TEMP/jeff-eval-${{ matrix.split }}"

      - name: Publish summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/jeff-eval-${{ matrix.split }}/summary.md" ]; then
            cat "$RUNNER_TEMP/jeff-eval-${{ matrix.split }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-real-${{ matrix.split }}-${{ github.sha }}
          path: ${{ runner.temp }}/jeff-eval-${{ matrix.split }}
