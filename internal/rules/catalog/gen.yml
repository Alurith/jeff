family: GEN

rules:
  - code: GEN001
    name: failure-path-integrity
    message: Failure paths may leave state, output, or contracts semantically inconsistent
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: >-
        Evaluate whether a reachable error, cancellation, or recovery path breaks
        an intended postcondition visible in this file. Identify the failed
        operation, the promised failure or recovery outcome, and the resulting
        observable state, output, or subsequent retry behavior. Respect explicitly
        allowed partial success and best-effort behavior. An unhandled error,
        a catch block, or an error return alone is not evidence of a violation.
        A non-nil error remains an error even if its message sounds successful.
        Do not invent effects or guarantees of unspecified dependencies.
        Exclude TODOs, stubs, placeholders, type/schema/range errors, and naming
        style. If a concrete temporal execution is already incorrect without an
        independent operation failing, keep it separate from this failure-path rule.
      criteria:
        "true": >-
          A reachable failure or recovery path has a concrete observable outcome
          that contradicts its intended postcondition, such as losing previously
          usable state, reporting an uncompleted operation as completed, or
          preventing a promised retry from performing the missing work.
        "false": >-
          No broken failure or recovery postcondition is evidenced; the failure
          is propagated or contained consistently with the contract; partial
          success is explicitly permitted; or the concern is only error-handling
          syntax, an excluded deterministic issue, or an independent temporal
          defect outside this failure-path rule.
    decision:
      pass_below: 0.50
      fail_at_or_above: 0.55

  - code: GEN002
    name: side-effect-transparency
    message: A relevant side effect may surprise callers of the interface
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: >-
        Evaluate whether an operation adds a relevant caller-visible or external
        effect that its name, signature, documentation, and visible usage do not
        reasonably communicate. Identify both the expected primary operation and
        the concrete additional mutation, persistence, deletion, messaging,
        network, or process effect. A primary result may be correct while the
        additional effect is surprising. Receiving a mutable object or database
        connection does not by itself advertise every possible mutation.
        Do not report effects merely because they exist, explicitly advertised
        writes, or incidental internal bookkeeping without a meaningful observable
        consequence. Exclude stubs, placeholders, deterministic validity errors,
        failure-only defects, temporal-only defects, and contradictions of the
        primary result better covered by the naming/behavior rule.
      criteria:
        "true": >-
          A reachable call performs a concrete, relevant additional effect on
          caller-owned or externally observable state that a reasonable caller
          would not expect from the visible interface and usage.
        "false": >-
          Relevant effects are absent, reasonably advertised, or merely incidental
          internal implementation details; or the concern is only I/O presence,
          mutation presence, a different GEN category, or naming style.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.60

  - code: GEN003
    name: within-file-semantic-duplication
    message: A domain decision or invariant is semantically duplicated within the file
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: >-
        Evaluate an advisory maintainability concern, not necessarily a current
        runtime bug. Require at least two independent implementations within this
        file of the same non-trivial domain policy, business decision, or invariant.
        Establish shared semantic ownership from the visible domain contract and
        usage, not merely matching syntax or suggestive names. Identify a concrete
        policy change that would require coordinated edits and could leave the
        implementations deciding differently. Current outputs may agree.
        Exclude trivial predicates, range checks, repeated constants, boilerplate,
        plumbing, tests, representation mappings, and distinct policies that merely
        look similar. Calls to one shared decision point are not independent
        implementations. Do not infer duplication across files.
      criteria:
        "true": >-
          Two or more independent implementations encode the same meaningful
          non-trivial domain decision, and a concrete change to that policy would
          require coordinated edits to prevent divergent decisions.
        "false": >-
          The policy has one authoritative implementation reused by callers;
          shared semantic ownership is not established; the repetition is trivial,
          structural, or infrastructural; or the implementations represent
          different domain policies.
    decision:
      pass_below: 0.10
      fail_at_or_above: 0.40

  - code: GEN004
    name: concrete-naming-behavior-mismatch
    message: A concrete name, signature, or interface may contradict observable behavior
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: >-
        Evaluate direct contradictions between an operation's primary observable
        behavior and a specific promise made by its concrete name or interface.
        Identify what a reasonable caller would rely on and a valid input for
        which the implementation does something materially different. Examples
        include parsing a value versus measuring its text, returning all records
        versus truncating them, or a specifically promised ordering being reversed.
        Keep the evidence valid under declared types and schemas: returning a
        different runtime type from an annotation is a deterministic validity
        issue, not this rule. Do not infer a promise from naming fashion, vague
        intent, or a preferred signature convention alone. Exclude stubs,
        placeholders, range errors, failure-only defects, temporal defects, and
        contradictions caused solely by additional hidden effects covered by the side-effect rule.
      criteria:
        "true": >-
          A concrete caller-facing promise is materially contradicted by the
          primary behavior on a valid input, and the contradiction is observable
          without relying on type/schema errors, naming style, or hidden effects.
        "false": >-
          The primary behavior matches the concrete promise, no sufficiently
          specific promise is established, or the concern is only a deterministic
          validity issue, a naming preference, or another GEN category.
    decision:
      pass_below: 0.25
      fail_at_or_above: 0.50
