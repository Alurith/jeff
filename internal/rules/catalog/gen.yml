family: GEN

rules:
  - code: GEN001
    name: failure-path-integrity
    message: Failure paths may leave state, output, or contracts semantically inconsistent
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: Judge the semantic consequences of errors, retries, cleanup, or rollback on state, output, or contracts, not error-handling syntax, unhandled err alone, TODO/stub/pass, or provisional-return patterns.
      criteria:
        true: An error or recovery path can leave state, output, or a promised contract inconsistent after the path completes.
        false: Failure and recovery paths preserve their intended state, output, and contracts, or the concern is only a deterministic or syntactic handling pattern.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.80

  - code: GEN002
    name: contract-invariant-safety
    message: A local contract or invariant may be semantically contradicted
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: Judge contradictions in local contracts or invariants that remain type-valid, not type errors, schema or range checks, TODO/stub/pass, or provisional-return findings.
      criteria:
        true: The file can violate a stated or inferable local contract or invariant while remaining valid according to its types and schema.
        false: No semantic contract or invariant contradiction is evident, or the concern is only a deterministic type, schema, range, or placeholder check.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.80

  - code: GEN003
    name: mixed-responsibility-boundary-mixing
    message: Independent responsibilities or domain and infrastructure concerns are semantically entangled
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: Judge conceptual boundary mixing only when it harms understanding or modification, not file size, import count, or the mere presence of I/O.
      criteria:
        true: Conceptually independent responsibilities, or domain and infrastructure concerns, are intertwined in a way that materially harms understanding or modification.
        false: The file has coherent conceptual boundaries, or the concern is only size, imports, I/O, coverage, or missing tests.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.80

  - code: GEN004
    name: side-effect-transparency
    message: A relevant side effect may surprise callers of the interface
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: Judge whether an observable side effect is hidden by the name, signature, or interface, not the mere presence of I/O or mutation.
      criteria:
        true: A relevant mutation, persistence, deletion, network, messaging, or similar effect is not reasonably signaled by the surrounding interface.
        false: Relevant effects are absent or apparent from the interface, or the concern is only that I/O or mutation exists.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.80

  - code: GEN005
    name: temporal-control-flow-fragility
    message: Correctness may depend on an unprotected temporal or control-flow condition
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: Judge semantic dependence on order, lifecycle, retry, synchronization, resource closure, commit, interleaving, or state history, not complexity metrics, unreachable code, or mechanical race checks.
      criteria:
        true: Correct behavior depends on an unprotected ordering, lifecycle, retry, lock, close, commit, interleaving, or state-history condition.
        false: Relevant temporal conditions are enforced or explicit, or the concern is only complexity, nesting, branch count, unreachable code, or a mechanical race finding.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.80

  - code: GEN006
    name: within-file-semantic-duplication
    message: A domain decision or invariant is semantically duplicated within the file
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: Judge repeated domain policy, decisions, or invariants with divergence risk, not textual, AST, clone, test, or boilerplate duplication.
      criteria:
        true: The same meaningful domain policy, decision, or invariant is implemented in separate places and can diverge.
        false: Repetition does not duplicate semantic knowledge, or the concern is only textual, structural, clone, test, or boilerplate duplication.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.80

  - code: GEN007
    name: concrete-naming-behavior-mismatch
    message: A concrete name, signature, or interface may contradict observable behavior
    scope: file
    files:
      include: ["**/*"]
      exclude:
        - "**/*.md"
        - "**/*.txt"
        - "**/.*"
        - "**/.*/**"
        - "**/vendor/**"
    question:
      type: noul
      instructions: Judge concrete contradictions between names or interfaces and observable behavior, excluding naming style and discrepancies caused only by hidden side effects.
      criteria:
        true: A reasonable caller would infer behavior from a concrete name, signature, or interface that the file observably violates.
        false: Names and interfaces match observable behavior, or the concern is only naming convention, style, or a hidden side effect covered by GEN004.
    decision:
      pass_below: 0.20
      fail_at_or_above: 0.80
